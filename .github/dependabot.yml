version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      prisma-major:
        patterns:
          - '@prisma/client'
          - 'prisma'
        update-types:
          - major
      eslint-major:
        patterns:
          - '@eslint/js'
          - 'eslint'
        update-types:
          - major
    ignore:
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types:
          - 'version-update:semver-minor'
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      server-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
