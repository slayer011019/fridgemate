name: AI crawler policy audit

on:
  push:
    branches:
      - ops/ai-crawl-control-audit
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAWLER_AUDIT_BASE_URL: https://xn--wh1bs8l5xa003adme.com

jobs:
  cloudflare-capability:
    name: Cloudflare credential capability check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Report credential presence without exposing values
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "cloudflare_api_token=present"
          else
            echo "cloudflare_api_token=absent"
          fi

          if [[ -n "${CLOUDFLARE_ZONE_ID}" ]]; then
            echo "cloudflare_zone_id=present"
          else
            echo "cloudflare_zone_id=absent"
          fi

  curl-audit:
    name: curl User-Agent audit
    runs-on: ubuntu-latest
    steps:
      - name: Probe production with curl
        shell: bash
        run: |
          set -uo pipefail

          agents=(
            "Human Chrome|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
            "OAI-SearchBot|OAI-SearchBot"
            "PerplexityBot|PerplexityBot"
            "Claude-SearchBot|Claude-SearchBot"
            "GPTBot|GPTBot"
            "CCBot|CCBot"
            "Google-Extended|Google-Extended"
            "Google-CloudVertexBot|Google-CloudVertexBot"
          )
          paths=("/" "/recipes" "/robots.txt")

          for entry in "${agents[@]}"; do
            label="${entry%%|*}"
            ua="${entry#*|}"

            for path in "${paths[@]}"; do
              headers="$(mktemp)"
              body="$(mktemp)"
              metrics="$(mktemp)"

              if curl --silent --show-error --location --retry 2 --max-time 30 \
                --user-agent "$ua" \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}|%{url_effective}|%{content_type}|%{size_download}\n' \
                "${CRAWLER_AUDIT_BASE_URL}${path}" >"$metrics"; then
                IFS='|' read -r status final_url content_type size_download <"$metrics"
                server="$(awk 'BEGIN { IGNORECASE=1 } /^server:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers")"
                cf_ray="$(awk 'BEGIN { IGNORECASE=1 } /^cf-ray:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers")"
                body_sha="$(sha256sum "$body" | awk '{print $1}')"
                preview="$(tr '\n\r' '  ' <"$body" | sed 's/[[:space:]]\+/ /g' | cut -c1-120)"
                printf 'probe=curl crawler=%q path=%q status=%q final_url=%q content_type=%q bytes=%q server=%q cf_ray=%q body_sha256=%q preview=%q\n' \
                  "$label" "$path" "$status" "$final_url" "$content_type" "$size_download" "$server" "$cf_ray" "$body_sha" "$preview"

                if [[ "$path" == "/robots.txt" ]]; then
                  echo "::group::robots.txt crawler=${label}"
                  cat "$body"
                  echo
                  echo "::endgroup::"
                fi
              else
                exit_code=$?
                printf 'probe=curl crawler=%q path=%q curl_exit=%q\n' "$label" "$path" "$exit_code"
              fi

              rm -f "$headers" "$body" "$metrics"
            done
          done

  chromium-audit:
    name: Chromium User-Agent audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe production with Chromium
        run: node scripts/audit-ai-crawler-policy.mjs
