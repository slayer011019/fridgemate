name: AI crawler direct-origin audit

on:
  push:
    branches:
      - ops/ai-crawl-control-audit
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAWLER_AUDIT_BASE_URL: https://fridgemate-fridgemates-projects.vercel.app

jobs:
  curl-origin-audit:
    name: curl direct-origin User-Agent audit
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vercel origin directly
        shell: bash
        run: |
          set -uo pipefail

          agents=(
            "Human Chrome|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
            "OAI-SearchBot|OAI-SearchBot"
            "PerplexityBot|PerplexityBot"
            "Claude-SearchBot|Claude-SearchBot"
            "GPTBot|GPTBot"
            "CCBot|CCBot"
            "Google-Extended|Google-Extended"
            "Google-CloudVertexBot|Google-CloudVertexBot"
          )
          paths=("/" "/recipes" "/robots.txt")

          for entry in "${agents[@]}"; do
            label="${entry%%|*}"
            ua="${entry#*|}"

            for path in "${paths[@]}"; do
              headers="$(mktemp)"
              body="$(mktemp)"
              metrics="$(mktemp)"

              if curl --silent --show-error --location --retry 2 --max-time 30 \
                --user-agent "$ua" \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}|%{url_effective}|%{content_type}|%{size_download}\n' \
                "${CRAWLER_AUDIT_BASE_URL}${path}" >"$metrics"; then
                IFS='|' read -r status final_url content_type size_download <"$metrics"
                server="$(awk 'BEGIN { IGNORECASE=1 } /^server:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers")"
                body_sha="$(sha256sum "$body" | awk '{print $1}')"
                printf 'probe=curl-origin crawler=%q path=%q status=%q final_url=%q content_type=%q bytes=%q server=%q body_sha256=%q\n' \
                  "$label" "$path" "$status" "$final_url" "$content_type" "$size_download" "$server" "$body_sha"
              else
                exit_code=$?
                printf 'probe=curl-origin crawler=%q path=%q curl_exit=%q\n' "$label" "$path" "$exit_code"
              fi

              rm -f "$headers" "$body" "$metrics"
            done
          done

  chromium-origin-audit:
    name: Chromium direct-origin User-Agent audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe Vercel origin directly with Chromium
        run: node scripts/audit-ai-crawler-policy.mjs
